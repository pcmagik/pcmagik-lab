<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Art Editor</title>
<style>
  :root {
    --bg: #1e1e24;
    --panel: #2a2a33;
    --panel-2: #33333f;
    --accent: #6c8cff;
    --text: #e6e6ee;
    --muted: #9a9aa8;
    --border: #40404d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    justify-content: center;
  }
  .app {
    display: flex;
    gap: 18px;
    padding: 18px;
    align-items: flex-start;
    max-width: 100%;
  }

  /* ---- Left toolbar ---- */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .tool-btn {
    width: 46px; height: 46px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, border-color .12s;
  }
  .tool-btn:hover { background: #3d3d4a; }
  .tool-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: #93a8ff;
  }
  .tool-btn svg { width: 22px; height: 22px; }

  /* ---- Center canvas area ---- */
  .canvas-wrap {
    background: var(--panel);
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .canvas-holder {
    line-height: 0;
    border: 1px solid var(--border);
    background: #14141a;
    border-radius: 6px;
    overflow: hidden;
  }
  canvas#art {
    display: block;
    cursor: crosshair;
    image-rendering: pixelated; /* crisp pixels, no anti-aliasing */
  }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  label.ctrl, button.action {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  button.action:hover { background: #3d3d4a; }
  select, .size-select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 13px;
  }

  /* ---- Right panel: colors, history, export ---- */
  .side {
    width: 250px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .side h3 {
    margin: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1;
    border-radius: 5px;
    border: 2px solid transparent;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.active { border-color: #fff; }
  /* checkerboard inside a swatch to show transparent ones */
  .swatch .chk-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(45deg, #555 25%, transparent 25%),
      linear-gradient(-45deg, #555 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #555 75%),
      linear-gradient(-45deg, transparent 75%, #555 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  }
  .swatch .fill { position: absolute; inset: 2px; border-radius: 3px; }

  .recent { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .recent .chip {
    aspect-ratio: 1; border-radius: 5px; cursor: pointer;
    border: 2px solid var(--border);
  }
  .recent .chip:hover { border-color: var(--accent); }

  .color-picker-wrap { display: flex; align-items: center; gap: 10px; }
  input[type="color"] {
    width: 46px; height: 40px; padding: 0; border: 1px solid var(--border);
    border-radius: 8px; background: none; cursor: pointer;
  }
  .hex-input {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 8px; border-radius: 8px; font-family: monospace; width: 84px; text-transform: uppercase;
  }

  .export-btns { display: flex; flex-direction: column; gap: 8px; }
  .export-btns button { text-align: center; }

  .history-btns { display: flex; gap: 8px; }
  .history-btns button { flex: 1; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }

  .hint { font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ TOOLS ============ -->
  <div class="toolbar">
    <button class="tool-btn active" data-tool="pencil" title="Pencil (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l6-1 11-11-5-5L4 16l-1 6z"/></svg>
    </button>
    <button class="tool-btn" data-tool="eraser" title="Eraser (X)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9-9 8 8-4 4z"/><path d="M13 5l8 8"/></svg>
    </button>
    <button class="tool-btn" data-tool="fill" title="Fill (G)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 3l3 3-9 9-3-3z"/><path d="M6 15l-3 3 3 3h6l3-3"/><path d="M14 7l3 3"/></svg>
    </button>
    <button class="tool-btn" data-tool="dropper" title="Eyedropper (I)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>
    </button>

    <div style="height:1px;background:var(--border);margin:4px 0"></div>

    <label class="checkbox-row">
      <input type="checkbox" id="gridToggle" checked /> Grid
    </label>
  </div>

  <!-- ============ CANVAS ============ -->
  <div class="canvas-wrap">
    <div class="row">
      <label>Size:
        <select id="sizeSelect">
          <option value="16">16 × 16</option>
          <option value="32" selected>32 × 32</option>
          <option value="64">64 × 64</option>
        </select>
      </label>
    </div>

    <div class="canvas-holder">
      <canvas id="art"></canvas>
    </div>

    <div class="row">
      <button class="action" id="undoBtn">↶ Undo</button>
      <button class="action" id="redoBtn">↷ Redo</button>
      <button class="action" id="clearBtn">🗑 Clear</button>
    </div>

    <div class="row export-btns" style="width:100%">
      <button class="action" id="downloadBtn">⬇ Download PNG</button>
    </div>
    <div class="hint">Ctrl/Cmd+Z undo · Ctrl/Cmd+Shift+Z redo</div>
  </div>

  <!-- ============ SIDE PANEL ============ -->
  <div class="side">
    <div>
      <h3>Current Color</h3>
      <div class="color-picker-wrap">
        <input type="color" id="colorPicker" value="#000000" />
        <input type="text" class="hex-input" id="hexInput" value="#000000" maxlength="7" />
      </div>
    </div>

    <div>
      <h3>Palette</h3>
      <div class="swatches" id="swatches"></div>
    </div>

    <div>
      <h3>Recent</h3>
      <div class="recent" id="recent"></div>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   Pixel Art Editor — vanilla JS, single file.

   Data model:
     - `grid` is a Uint8ClampedArray of length w*h*4 holding RGBA values.
       Alpha === 0 means transparent.
     - The canvas is displayed scaled up by `pixelSize`; each grid cell is one
       crisp block (image-rendering: pixelated + imageSmoothingEnabled=false).
   ========================================================================= */

const canvas = document.getElementById("art");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

// ---- State -------------------------------------------------------------
let W = 32, H = 32;          // grid dimensions (cells)
let pixelSize = 16;           // display size of one cell in px
let grid = makeGrid(W, H);    // RGBA data

const TOOL = { pencil: "pencil", eraser: "eraser", fill: "fill", dropper: "dropper" };
let currentTool = TOOL.pencil;
let currentColor = [0, 0, 0, 255];   // RGBA of the active color

// ---- History (undo/redo) ----------------------------------------------
const MAX_HISTORY = 40;            // well above the required 20
let history = [];                  // array of Uint8ClampedArray snapshots
let histIndex = -1;                // points at current snapshot in history
let dirtyHistory = false;          // set while a drag stroke is in progress

// ---- UI toggles --------------------------------------------------------
let showGrid = true;

// ------------------------------------------------------------------------
// Grid helpers
// ------------------------------------------------------------------------
function makeGrid(w, h) { return new Uint8ClampedArray(w * h * 4); }

function idx(x, y) { return (y * W + x) * 4; }

function setPixel(x, y, rgba) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = idx(x, y);
  grid[i] = rgba[0];
  grid[i + 1] = rgba[1];
  grid[i + 2] = rgba[2];
  grid[i + 3] = rgba[3];
}

function getPixelRGBA(x, y) {
  const i = idx(x, y);
  return [grid[i], grid[i + 1], grid[i + 2], grid[i + 3]];
}

// ------------------------------------------------------------------------
// Rendering. Draws the RGBA grid at native resolution, then scales up once.
// Transparent pixels get a checkerboard pattern.
// ------------------------------------------------------------------------
function render() {
  // Draw into an offscreen-sized buffer matching the grid exactly.
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext("2d");
  const imgData = tctx.createImageData(W, H);
  imgData.data.set(grid);
  tctx.putImageData(imgData, 0, 0);

  canvas.width = W * pixelSize;
  canvas.height = H * pixelSize;
  ctx.imageSmoothingEnabled = false;   // keep edges crisp at any scale

  // Checkerboard background (visible through transparent pixels).
  drawCheckerboard();

  // Blit the artwork on top.
  ctx.drawImage(tmp, 0, 0, W * pixelSize, H * pixelSize);

  if (showGrid) drawGridOverlay();
}

function drawCheckerboard() {
  const s = pixelSize;
  const size = Math.max(W, H) * s;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#cbcbcb";
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if ((x + y) % 2 === 0) {
        ctx.fillRect(x * s, y * s, s, s);
      }
    }
  }
}

function drawGridOverlay() {
  const s = pixelSize;
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= W; i++) {
    ctx.moveTo(i * s + 0.5, 0.5);
    ctx.lineTo(i * s + 0.5, H * s + 0.5);
  }
  for (let j = 0; j <= H; j++) {
    ctx.moveTo(0.5, j * s + 0.5);
    ctx.lineTo(W * s + 0.5, j * s + 0.5);
  }
  ctx.stroke();
}

// ------------------------------------------------------------------------
// History management. One drag stroke == one undo step.
// ------------------------------------------------------------------------
function pushHistory() {
  // Discard any redo branch before recording a new state.
  if (histIndex < history.length - 1) {
    history = history.slice(0, histIndex + 1);
  }
  history.push(grid.slice());
  histIndex = history.length - 1;
  if (history.length > MAX_HISTORY) {
    history.shift();
    histIndex--;
  }
}

// Called once per drag stroke (on mouseup).
function commitStroke() {
  if (!dirtyHistory) return;
  dirtyHistory = false;
  pushHistory();
  persist();
}

function undo() {
  if (histIndex <= 0) return;
  histIndex--;
  grid = history[histIndex].slice();
  afterHistoryChange();
}

function redo() {
  if (histIndex >= history.length - 1) return;
  histIndex++;
  grid = history[histIndex].slice();
  afterHistoryChange();
}

function afterHistoryChange() {
  render();
  persist();
}

// ------------------------------------------------------------------------
// Pointer interaction. Click + drag drawing.
// ------------------------------------------------------------------------
let painting = false;
let lastCell = null;

function eventToCell(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor(((e.clientX - rect.left) / rect.width) * W);
  const y = Math.floor(((e.clientY - rect.top) / rect.height) * H);
  return { x, y };
}

// Bresenham line so fast drags paint continuous strokes.
function drawLine(from, to, paintFn) {
  let x0 = from.x, y0 = from.y, x1 = to.x, y1 = to.y;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  while (true) {
    paintFn(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx)  { err += dx; y0 += sy; }
  }
}

function onDown(e) {
  if (e.button !== 0) return;   // left button only
  painting = true;
  const cell = eventToCell(e);
  if (cell.x < 0 || cell.y < 0 || cell.x >= W || cell.y >= H) return;

  dirtyHistory = true;   // this whole stroke becomes a single undo step

  if (currentTool === TOOL.fill) {
    floodFill(cell.x, cell.y, currentColor);
    painting = false;    // fill is a click-only tool
    commitStroke();
    return;
  }
  if (currentTool === TOOL.dropper) {
    const c = getPixelRGBA(cell.x, cell.y);
    if (c[3] > 0) setColorFromRGBA(c);
    else setTransparentActive();
    painting = false;
    return;
  }

  // Pencil / eraser: paint this pixel and remember position.
  lastCell = cell;
  applyAt(cell.x, cell.y);
}

function onMove(e) {
  if (!painting) return;
  const cell = eventToCell(e);
  if (cell.x < 0 || cell.y < 0 || cell.x >= W || cell.y >= H) return;
  drawLine(lastCell, cell, applyAt);
  lastCell = cell;
}

function onUp() {
  if (!painting) return;
  painting = false;
  commitStroke();
}

// Paint a single pixel according to the active tool.
function applyAt(x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  if (currentTool === TOOL.eraser) {
    setPixel(x, y, [0, 0, 0, 0]);
  } else {
    setPixel(x, y, currentColor);
  }
  trackRecent(currentTool === TOOL.eraser ? null : currentColor);
}

// ------------------------------------------------------------------------
// Flood fill (iterative BFS — no recursion, safe for 64×64).
// ------------------------------------------------------------------------
function floodFill(startX, startY, newColor) {
  if (startX < 0 || startY < 0 || startX >= W || startY >= H) return;
  const target = getPixelRGBA(startX, startY);
  // Nothing to do if the pixel already matches the fill color.
  if (target[0] === newColor[0] && target[1] === newColor[1] &&
      target[2] === newColor[2] && target[3] === newColor[3]) return;

  const w = W, h = H;
  const stack = [[startX, startY]];
  while (stack.length) {
    const [x, y] = stack.pop();
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const cur = getPixelRGBA(x, y);
    // Match contiguous pixels of the same color.
    if (cur[0] !== target[0] || cur[1] !== target[1] ||
        cur[2] !== target[2] || cur[3] !== target[3]) continue;

    setPixel(x, y, newColor);
    stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
}

// ------------------------------------------------------------------------
// Color handling.
// ------------------------------------------------------------------------
const PRESET_COLORS = [
  "#000000", "#413100", "#7a2800", "#b5330a",
  "#f2002c", "#771c63", "#6b1fff", "#0f56ff",
  "#00a1ff", "#04d1ff", "#00e569", "#8ac926",
  "#ffd400", "#ffffff", "#94979c", "#734a52"
];

function rgbaToHex(c) {
  return "#" + [c[0], c[1], c[2]].map(v => v.toString(16).padStart(2, "0")).join("");
}

function hexToRGBA(hex) {
  const h = hex.replace("#", "");
  const num = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
}

function setColorFromRGBA(c) {
  currentColor = [c[0], c[1], c[2], 255];
  syncColorUI();
}

function setTransparentActive() {
  currentColor = [0, 0, 0, 0];
  syncColorUI();
}

function syncColorUI() {
  const picker = document.getElementById("colorPicker");
  const hexInput = document.getElementById("hexInput");
  if (currentColor[3] === 0) {
    // Represent transparent as white-ish in native pickers.
    picker.value = "#ffffff";
    hexInput.value = "#FFFFFF";
  } else {
    picker.value = rgbaToHex(currentColor);
    hexInput.value = rgbaToHex(currentColor).toUpperCase();
  }
  highlightActiveSwatch(rgbaToHex(currentColor));
}

// Track the last-used colors for the "Recent" strip.
const RECENT_LIMIT = 8;
let recentColors = [];

function trackRecent(c) {
  if (!c) return; // eraser doesn't add to recent palette
  const hex = rgbaToHex(c);
  recentColors = recentColors.filter(h => h !== hex);
  recentColors.unshift(hex);
  if (recentColors.length > RECENT_LIMIT) recentColors.pop();
  renderRecent();
}

function setRecentActive(hex) {
  currentColor = hexToRGBA(hex);
  syncColorUI();
}

// ------------------------------------------------------------------------
// Build UI: swatches, recent strip.
// ------------------------------------------------------------------------
function buildSwatches() {
  const wrap = document.getElementById("swatches");
  wrap.innerHTML = "";
  PRESET_COLORS.forEach(hex => {
    const el = document.createElement("div");
    el.className = "swatch";
    el.dataset.hex = hex;
    el.title = hex;
    el.appendChild(Object.assign(document.createElement("div"), { className: "chk-bg" }));
    el.appendChild(Object.assign(document.createElement("div"), { className: "fill", style: `background:${hex}` }));
    el.addEventListener("click", () => setRecentActive(hex));
    wrap.appendChild(el);
  });
}

function renderRecent() {
  const wrap = document.getElementById("recent");
  wrap.innerHTML = "";
  if (recentColors.length === 0) {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.style.gridColumn = "1 / -1";
    hint.textContent = "Draw something to see recent colors…";
    wrap.appendChild(hint);
    return;
  }
  recentColors.forEach(hex => {
    const el = document.createElement("div");
    el.className = "chip";
    el.style.background = hex;
    el.title = hex;
    el.addEventListener("click", () => setRecentActive(hex));
    wrap.appendChild(el);
  });
}

function highlightActiveSwatch(hex) {
  document.querySelectorAll(".swatch").forEach(s => {
    s.classList.toggle("active", s.dataset.hex.toLowerCase() === hex.toLowerCase());
  });
}

// ------------------------------------------------------------------------
// Tools UI.
// ------------------------------------------------------------------------
function selectTool(tool) {
  currentTool = tool;
  document.querySelectorAll(".tool-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tool === tool);
  });
  canvas.style.cursor = tool === "dropper" ? "pointer" : "crosshair";
}

// ------------------------------------------------------------------------
// Grid size switching (asks for confirmation and clears).
// ------------------------------------------------------------------------
function changeSize(newSize) {
  if (W === newSize && H === newSize) return;
  const drawing = grid.some(v => v !== 0);
  if (drawing && !confirm(`Change canvas to ${newSize}×${newSize}? This will clear your current drawing.`)) {
    return;
  }
  W = H = newSize;
  pixelSize = newSize <= 16 ? 24 : newSize <= 32 ? 16 : 10;
  grid = makeGrid(W, H);
  history = [];
  histIndex = -1;
  afterResize();
}

function afterResize() {
  // Seed a fresh history so undo/redo works on the new canvas.
  pushHistory();
  render();
  persist();
}

// ------------------------------------------------------------------------
// Export to PNG (each pixel -> 10×10 block, transparency preserved).
// ------------------------------------------------------------------------
function downloadPNG() {
  const scale = 10;
  const out = document.createElement("canvas");
  out.width = W * scale;
  out.height = H * scale;
  const octx = out.getContext("2d");
  // Render current grid at native res into a temp, then upscale crisply.
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext("2d");
  const imgData = tctx.createImageData(W, H);
  imgData.data.set(grid);
  tctx.putImageData(imgData, 0, 0);

  octx.imageSmoothingEnabled = false;
  octx.drawImage(tmp, 0, 0, W * scale, H * scale);

  const link = document.createElement("a");
  link.download = `pixel-art-${W}x${H}.png`;
  link.href = out.toDataURL("image/png");
  link.click();
}

// ------------------------------------------------------------------------
// Clear with confirmation.
// ------------------------------------------------------------------------
function clearCanvas() {
  if (!confirm("Clear the entire canvas?")) return;
  grid = makeGrid(W, H);
  pushHistory();
  render();
  persist();
}

// ------------------------------------------------------------------------
// localStorage persistence.
// ------------------------------------------------------------------------
const STORAGE_KEY = "pixelArtEditor";

function persist() {
  try {
    const data = JSON.stringify({ w: W, h: H, px: Array.from(grid) });
    localStorage.setItem(STORAGE_KEY, data);
  } catch (e) { /* storage may be unavailable; ignore */ }
}

function loadSaved() {
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    if (!data || typeof data.w !== "number" || !Array.isArray(data.px)) return false;
    W = H = data.w;
    pixelSize = newSizeFor(W);
    grid = Uint8ClampedArray.from(data.px);
    // Trim/pad in case stored size doesn't match array length.
    if (grid.length !== W * H * 4) return false;
    pushHistory();
    render();
    return true;
  } catch (e) { return false; }
}

function newSizeFor(n) { return n <= 16 ? 24 : n <= 32 ? 16 : 10; }

// ------------------------------------------------------------------------
// Keyboard shortcuts.
// ------------------------------------------------------------------------
function onKey(e) {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const key = e.key.toLowerCase();
  if ((key === "z" && !e.shiftKey)) { e.preventDefault(); undo(); }
  else if ((key === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
}

// ------------------------------------------------------------------------
// Wiring.
// ------------------------------------------------------------------------
function init() {
  buildSwatches();
  renderRecent();

  // Tools
  document.querySelectorAll(".tool-btn").forEach(b => {
    b.addEventListener("click", () => selectTool(b.dataset.tool));
  });

  // Canvas pointer events (relative to the scaled canvas).
  canvas.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);

  // Size selector.
  const sizeSel = document.getElementById("sizeSelect");
  sizeSel.value = String(W);
  sizeSel.addEventListener("change", () => changeSize(parseInt(sizeSel.value, 10)));

  // Grid toggle.
  document.getElementById("gridToggle").addEventListener("change", (e) => {
    showGrid = e.target.checked;
    render();
  });

  // Color picker + hex input.
  const picker = document.getElementById("colorPicker");
  const hexInput = document.getElementById("hexInput");
  picker.addEventListener("input", () => setColorFromRGBA(hexToRGBA(picker.value)));
  hexInput.addEventListener("change", () => {
    const v = hexInput.value.trim();
    if (/^#?[0-9a-fA-F]{6}$/.test(v)) setColorFromRGBA(hexToRGBA(v));
    else picker.value = "#000000";
  });

  // Actions.
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  document.getElementById("clearBtn").addEventListener("click", clearCanvas);
  document.getElementById("downloadBtn").addEventListener("click", downloadPNG);

  // Keyboard shortcuts.
  window.addEventListener("keydown", onKey);

  // Load saved artwork or start fresh with a history entry.
  if (!loadSaved()) {
    pushHistory();
    render();
  }
}

// Tool keyboard shortcuts (E/X/I/G).
window.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey) return; // don't hijack undo/redo
  const k = e.key.toLowerCase();
  if (k === "e") selectTool(TOOL.pencil);
  else if (k === "x") selectTool(TOOL.eraser);
  else if (k === "i") selectTool(TOOL.dropper);
  else if (k === "g") selectTool(TOOL.fill);
});

init();
</script>
</body>
</html>
