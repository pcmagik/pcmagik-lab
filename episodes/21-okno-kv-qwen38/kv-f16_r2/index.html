<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Pixel Art Editor</title>
<style>
  /* ============================================================
     Theme & layout
     ============================================================ */
  :root {
    --bg: #14161d;
    --panel: #1d2029;
    --panel-2: #232734;
    --border: #2c3140;
    --text: #e8eaf0;
    --muted: #9aa3b5;
    --accent: #41a6f6;
    --accent-soft: rgba(65, 166, 246, 0.16);
    --danger: #ef5767;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(1100px 520px at 70% -10%, #242b44 0%, var(--bg) 60%);
    min-height: 100vh;
    accent-color: var(--accent);
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 18px 24px 4px;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
  .tag { margin: 0; color: var(--muted); font-size: 12.5px; }

  main {
    display: flex; flex-wrap: wrap; gap: 18px;
    align-items: flex-start; justify-content: center;
    padding: 14px 24px 30px;
  }
  .panel {
    width: 224px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex; flex-direction: column; gap: 14px;
  }
  h2 {
    margin: 0 0 8px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted);
  }

  /* ============================================================
     Buttons
     ============================================================ */
  button {
    font: inherit; color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
  }
  button:hover:not(:disabled) { background: #2a2f3f; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Tool grid (2 columns) */
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px; font-size: 11.5px; color: var(--muted);
  }
  .tool svg { width: 20px; height: 20px; }
  .tool.active {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  /* Segmented size control */
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    flex: 1; border: 0; border-radius: 0; background: transparent;
    padding: 8px 0; font-size: 12.5px;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover:not(:disabled) { background: #2a2f3f; }
  .seg button.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }

  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .hint { margin: 0; color: var(--muted); font-size: 11.5px; }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 4px; font-size: 10.5px;
    font-family: ui-monospace, monospace;
  }

  /* ============================================================
     Stage (canvas)
     ============================================================ */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #board {
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--border);
    cursor: crosshair;
    touch-action: none;               /* no scroll/zoom while drawing */
    user-select: none; -webkit-user-select: none;
  }
  .status { color: var(--muted); font-size: 12px; min-height: 17px; }

  /* ============================================================
     Color area
     ============================================================ */
  .color-row { display: flex; gap: 10px; align-items: center; }
  .current-swatch {
    width: 46px; height: 46px; flex: none;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  input[type="color"] {
    flex: 1; min-width: 0;
    height: 46px; padding: 4px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2); cursor: pointer;
  }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .swatch {
    aspect-ratio: 1; padding: 0;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.18);
  }
  .swatch.active { outline: 2px solid var(--accent); outline-offset: 2px; }
  .recent { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .recent .swatch { aspect-ratio: 1; }
  .empty-note { color: var(--muted); font-size: 11.5px; grid-column: 1 / -1; }

  /* ============================================================
     Actions
     ============================================================ */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .full { grid-column: 1 / -1; }
  .primary { background: var(--accent); border-color: transparent; color: #0b1220; font-weight: 600; }
  .primary:hover:not(:disabled) { background: #5cb2f8; }
  .danger { color: #ff8f9b; }
  .danger:hover:not(:disabled) { background: rgba(239, 87, 103, 0.15); }
</style>
</head>
<body>

<header>
  <h1>Pixel Art Editor</h1>
  <p class="tag">vanilla JS &middot; canvas &middot; no libraries</p>
</header>

<main>
  <!-- ================= Left panel: tools & grid ================= -->
  <aside class="panel" aria-label="Tools">
    <div>
      <h2>Tools</h2>
      <div class="tool-grid" role="toolbar" aria-label="Drawing tools">
        <button class="tool active" data-tool="pencil" title="Pencil (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          <span>Pencil</span>
        </button>
        <button class="tool" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span>Eraser</span>
        </button>
        <button class="tool" data-tool="fill" title="Fill (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h5"/><path d="M2 13c.9.9 2 1.45 3 1.45A4 4 0 0 0 12 10c0-1.1-.45-2.1-1.45-3L2 13Z"/><path d="M22 20c0 .8-.7 1.5-1.5 1.5S19 20.8 19 20s.7-1.5 1.5-1.5 1.5.7 1.5 1.5Z"/></svg>
          <span>Fill</span>
        </button>
        <button class="tool" data-tool="eyedropper" title="Eyedropper (I)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9"/><path d="M3 14l3 3 9-9"/><path d="m12 5 3-3L19 2l1 1-3 3"/><path d="m11.5 6.5 6 6"/><path d="M18 13v-3"/><path d="M15 16h-3"/></svg>
          <span>Eyedrop</span>
        </button>
      </div>
    </div>

    <div>
      <h2>Grid size</h2>
      <div class="seg" id="sizeSeg" role="group" aria-label="Grid size">
        <button data-size="16">16&times;16</button>
        <button data-size="32" class="active">32&times;32</button>
        <button data-size="64">64&times;64</button>
      </div>
    </div>

    <label class="check">
      <input type="checkbox" id="gridToggle" checked>
      Show grid lines
    </label>

    <p class="hint">
      Shortcuts: <kbd>Ctrl/&#8984;+Z</kbd> undo &middot; <kbd>Ctrl/&#8984;+Shift+Z</kbd> redo<br>
      Tools: <kbd>P</kbd> <kbd>E</kbd> <kbd>F</kbd> <kbd>I</kbd>
    </p>
  </aside>

  <!-- ================= Center: canvas ================= -->
  <section class="stage">
    <canvas id="board" width="512" height="512" aria-label="Pixel art canvas"></canvas>
    <div class="status" id="status" aria-live="polite"></div>
  </section>

  <!-- ================= Right panel: color & actions ================= -->
  <aside class="panel" aria-label="Color and actions">
    <div>
      <h2>Color</h2>
      <div class="color-row">
        <div class="current-swatch" id="currentSwatch" title="Current color"></div>
        <input type="color" id="colorPicker" value="#ffcd75" aria-label="Pick a color">
      </div>
    </div>

    <div>
      <h2>Palette</h2>
      <div class="palette" id="palette"></div>
    </div>

    <div>
      <h2>Recent</h2>
      <div class="recent" id="recent"></div>
    </div>

    <div>
      <h2>Actions</h2>
      <div class="actions">
        <button id="undoBtn" title="Undo (Ctrl/⌘+Z)">Undo</button>
        <button id="redoBtn" title="Redo (Ctrl/⌘+Shift+Z)">Redo</button>
        <button id="clearBtn" class="danger full">Clear</button>
        <button id="downloadBtn" class="primary full">Download PNG</button>
      </div>
    </div>
  </aside>
</main>

<script>
'use strict';

/* ================================================================
   Constants
   ================================================================ */
const GRID_SIZES   = [16, 32, 64];
const HISTORY_LIMIT = 100;      // spec requires >= 20 undo steps
const RECENT_LIMIT  = 8;        // most recently used colors
const EXPORT_SCALE  = 10;       // each art pixel -> 10x10 block in the PNG

const STORAGE = {
  size:   'pixelart.size',
  grid:   'pixelart.grid',
  color:  'pixelart.color',
  recent: 'pixelart.recent',
};

// 16 preset colors (PICO-8 inspired palette).
const PALETTE = [
  '#1a1c2c', '#5d275d', '#b13e53', '#ef7d57',
  '#ffcd75', '#a7f070', '#38b764', '#257179',
  '#29366f', '#3b5dc9', '#41a6f6', '#73eff7',
  '#f4f4f4', '#94b0c2', '#566c86', '#333c57',
];

const TOOL_LABEL = { pencil: 'Pencil', eraser: 'Eraser', fill: 'Fill', eyedropper: 'Eyedropper' };
const HEX_RE = /^#[0-9a-f]{6}$/i;

/* ================================================================
   DOM references
   ================================================================ */
const board       = document.getElementById('board');
const ctx         = board.getContext('2d');
const statusEl    = document.getElementById('status');
const colorPicker = document.getElementById('colorPicker');
const currentSwatch = document.getElementById('currentSwatch');
const paletteEl   = document.getElementById('palette');
const recentEl    = document.getElementById('recent');
const sizeSeg     = document.getElementById('sizeSeg');
const gridToggle  = document.getElementById('gridToggle');
const undoBtn     = document.getElementById('undoBtn');
const redoBtn     = document.getElementById('redoBtn');
const clearBtn    = document.getElementById('clearBtn');
const downloadBtn = document.getElementById('downloadBtn');

// N x N master canvas: one canvas pixel == one art cell.
// We always blit it with integer scaling + smoothing disabled,
// which guarantees crisp pixel edges at every grid size.
const artCanvas = document.createElement('canvas');
const artCtx    = artCanvas.getContext('2d');

/* ================================================================
   State
   ================================================================ */
let N = 32;                                  // grid size (cells per side)
let grid = new Array(N * N).fill(null);      // null = transparent, else '#rrggbb'
let tool = 'pencil';
let currentColor = '#ffcd75';
let recent = [];                             // up to RECENT_LIMIT colors
let gridLines = true;
let cellPx = 16;                             // internal canvas px per cell (always an integer)

// Drawing state machine: idle -> drawing -> idle.
let drawing = false;
let strokeChanged = false;                   // did this stroke actually paint anything?
let lastCell = null;                         // last painted cell (for drag interpolation)
let hoverCell = null;                        // cell under the pointer (for the outline)

// Undo / redo: `history` is a list of grid snapshots, `historyIndex`
// points at the current one. A stroke / fill / clear = one entry.
let history = [];
let historyIndex = -1;

/* ================================================================
   Canvas metrics — pick an integer internal cell size so that
   scaling, grid lines and hover outlines all land on pixel
   boundaries (no anti-aliasing bleed).
   ================================================================ */
function setupCanvasMetrics() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  // Aim for ~512 CSS px, clamped for small windows.
  const cssTarget = Math.max(240, Math.min(512, window.innerWidth - 96));
  cellPx = Math.max(1, Math.floor(cssTarget * dpr / N));

  const px = cellPx * N;                     // internal canvas size
  board.width  = px;                         // setting width also clears the canvas
  board.height = px;
  board.style.width  = (px / dpr) + 'px';
  board.style.height = (px / dpr) + 'px';
}

/* ================================================================
   Rendering
   ================================================================ */
// Light checkerboard shown beneath transparent pixels.
function drawCheckerboard() {
  const s = Math.max(4, cellPx >> 1);        // checker square size (half a cell)
  ctx.fillStyle = '#eef0f4';
  ctx.fillRect(0, 0, board.width, board.height);
  ctx.fillStyle = '#dfe2e8';
  for (let y = 0; y < board.height; y += s) {
    for (let x = ((y / s) % 2) * s; x < board.width; x += s * 2) {
      ctx.fillRect(x, y, s, s);
    }
  }
}

// 1px grid lines drawn with fillRect (integer coords) so they stay crisp.
function drawGridLines() {
  const W = board.width, H = board.height;
  ctx.fillStyle = 'rgba(90, 100, 120, 0.35)';
  for (let i = 1; i < N; i++) {
    const p = i * cellPx;
    ctx.fillRect(p, 0, 1, H);                // vertical line
    ctx.fillRect(0, p, W, 1);                // horizontal line
  }
  // Slightly darker outer border.
  ctx.fillStyle = 'rgba(90, 100, 120, 0.6)';
  ctx.fillRect(0, 0, W, 1);
  ctx.fillRect(0, 0, 1, H);
  ctx.fillRect(W - 1, 0, 1, H);
  ctx.fillRect(0, H - 1, W, 1);
}

// Outline of the hovered cell.
function drawHover() {
  const [x, y] = hoverCell;
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(50, 60, 80, 0.9)';
  ctx.strokeRect(x * cellPx + 1, y * cellPx + 1, cellPx - 2, cellPx - 2);
}

// Full redraw: checkerboard -> artwork (integer-scaled) -> grid -> hover.
function render() {
  // Rebuild the N x N master from the model.
  artCanvas.width  = N;                      // also clears it
  artCanvas.height = N;
  for (let y = 0; y < N; y++) {
    const row = y * N;
    for (let x = 0; x < N; x++) {
      const c = grid[row + x];
      if (!c) continue;
      artCtx.fillStyle = c;
      artCtx.fillRect(x, y, 1, 1);
    }
  }

  ctx.clearRect(0, 0, board.width, board.height);
  drawCheckerboard();
  ctx.imageSmoothingEnabled = false;         // crisp scaling, no AA bleed
  ctx.drawImage(artCanvas, 0, 0, N, N, 0, 0, cellPx * N, cellPx * N);
  if (gridLines) drawGridLines();
  if (hoverCell && !drawing) drawHover();
  updateStatus();
}

function updateStatus() {
  const pos = hoverCell ? ' · cell (' + hoverCell[0] + ', ' + hoverCell[1] + ')' : '';
  statusEl.textContent = N + '×' + N + ' · ' + TOOL_LABEL[tool] + ' · ' + currentColor + pos;
}

/* ================================================================
   Pixel operations
   ================================================================ */
// Map a pointer event to a grid cell, or null when outside the board.
function eventCell(e) {
  const rect = board.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return null;
  const x = Math.floor((e.clientX - rect.left) / rect.width * N);
  const y = Math.floor((e.clientY - rect.top) / rect.height * N);
  if (x < 0 || y < 0 || x >= N || y >= N) return null;
  return [x, y];
}

// Set one cell (no render, no history) — returns true if it changed.
function setCell(x, y, color) {
  const i = y * N + x;
  if (grid[i] === color) return false;
  grid[i] = color;
  return true;
}

// Bresenham line between two cells so fast drags leave no gaps.
function paintLine(a, b, color) {
  let [x0, y0] = a;
  const [x1, y1] = b;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, changed = false;
  for (;;) {
    if (setCell(x0, y0, color)) changed = true;
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 <  dx) { err += dx; y0 += sy; }
  }
  return changed;
}

/* ================================================================
   Flood fill — iterative DFS with an explicit stack (BFS-style
   work queue), so even a full 64x64 fill can never recurse or
   overflow the call stack. 4-way connectivity.
   ================================================================ */
function floodFill(sx, sy, color) {
  const total = N * N;
  const target = grid[sy * N + sx];
  if (target === color) return false;        // filling with the same color: no-op

  const visited = new Uint8Array(total);
  const stack = [sy * N + sx];

  while (stack.length) {
    const i = stack.pop();
    if (visited[i] || grid[i] !== target) continue;
    visited[i] = 1;
    grid[i] = color;

    const x = i % N;
    const y = (i / N) | 0;
    if (x > 0)     stack.push(i - 1);
    if (x < N - 1) stack.push(i + 1);
    if (y > 0)     stack.push(i - N);
    if (y < N - 1) stack.push(i + N);
  }
  return true;
}

/* ================================================================
   Undo / redo
   ================================================================ */
function commit() {
  // Drop any redo-able future, then record the new state as one step.
  history = history.slice(0, historyIndex + 1);
  history.push(grid.slice());
  if (history.length > HISTORY_LIMIT) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedoButtons();
  save();
  render();
}

function undo() {
  if (historyIndex <= 0) return;
  historyIndex--;
  grid = history[historyIndex].slice();
  updateUndoRedoButtons();
  save();
  render();
}

function redo() {
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  grid = history[historyIndex].slice();
  updateUndoRedoButtons();
  save();
  render();
}

function updateUndoRedoButtons() {
  undoBtn.disabled = historyIndex <= 0;
  redoBtn.disabled = historyIndex >= history.length - 1;
}

/* ================================================================
   Colors: picker, palette, recent strip
   ================================================================ */
function setCurrentColor(c) {
  currentColor = String(c).toLowerCase();
  colorPicker.value = currentColor;
  currentSwatch.style.background = currentColor;
  // Reflect the active swatch in the palette.
  paletteEl.querySelectorAll('.swatch').forEach(el => {
    el.classList.toggle('active', el.dataset.color === currentColor);
  });
  updateStatus();
  save();
}

function addRecent(c) {
  c = String(c).toLowerCase();
  recent = [c, ...recent.filter(x => x !== c)].slice(0, RECENT_LIMIT);
  renderRecent();
  save();
}

function renderPalette() {
  paletteEl.innerHTML = '';
  for (const c of PALETTE) {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.dataset.color = c;
    b.style.background = c;
    b.title = c;
    b.setAttribute('aria-label', 'Use color ' + c);
    b.addEventListener('click', () => setCurrentColor(c));
    paletteEl.appendChild(b);
  }
}

function renderRecent() {
  recentEl.innerHTML = '';
  if (recent.length === 0) {
    const note = document.createElement('span');
    note.className = 'empty-note';
    note.textContent = 'Colors you draw with will appear here.';
    recentEl.appendChild(note);
    return;
  }
  for (const c of recent) {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.dataset.color = c;
    b.style.background = c;
    b.title = c;
    b.setAttribute('aria-label', 'Use recent color ' + c);
    b.addEventListener('click', () => setCurrentColor(c));
    recentEl.appendChild(b);
  }
}

/* ================================================================
   Persistence (localStorage)
   ================================================================ */
function save() {
  try {
    localStorage.setItem(STORAGE.size, String(N));
    localStorage.setItem(STORAGE.grid, JSON.stringify(grid));
    localStorage.setItem(STORAGE.color, currentColor);
    localStorage.setItem(STORAGE.recent, JSON.stringify(recent));
  } catch (err) {
    /* private mode / quota exceeded — persistence is best-effort */
  }
}

function load() {
  let stored;
  try {
    const size = parseInt(localStorage.getItem(STORAGE.size), 10);
    if (GRID_SIZES.includes(size)) N = size;

    stored = JSON.parse(localStorage.getItem(STORAGE.grid) || 'null');
    if (Array.isArray(stored) && stored.length === N * N &&
        stored.every(v => v === null || (typeof v === 'string' && HEX_RE.test(v)))) {
      grid = stored.map(v => v ? v.toLowerCase() : null);
    }

    const c = localStorage.getItem(STORAGE.color);
    if (c && HEX_RE.test(c)) currentColor = c.toLowerCase();

    const r = JSON.parse(localStorage.getItem(STORAGE.recent) || 'null');
    if (Array.isArray(r)) recent = r.filter(v => typeof v === 'string' && HEX_RE.test(v))
                                     .map(v => v.toLowerCase()).slice(0, RECENT_LIMIT);
  } catch (err) {
    /* corrupt storage — fall back to defaults */
  }
}

/* ================================================================
   Tools
   ================================================================ */
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool').forEach(el =>
    el.classList.toggle('active', el.dataset.tool === t));
  updateStatus();
}

/* ================================================================
   Pointer handling — one drag = one stroke = one undo step
   ================================================================ */
board.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;                // primary button only
  const cell = eventCell(e);
  if (!cell) return;
  e.preventDefault();

  switch (tool) {
    case 'pencil':
    case 'eraser': {
      const color = tool === 'pencil' ? currentColor : null;
      drawing = true;
      strokeChanged = false;
      board.setPointerCapture(e.pointerId);  // keep receiving moves outside
      if (setCell(cell[0], cell[1], color)) strokeChanged = true;
      lastCell = cell;
      render();
      break;
    }
    case 'fill': {
      // Flood-fill is instant and single-shot: one click, one undo step.
      if (floodFill(cell[0], cell[1], currentColor)) {
        commit();
        addRecent(currentColor);
      }
      break;
    }
    case 'eyedropper': {
      const c = grid[cell[1] * N + cell[0]];
      if (c) {                               // transparent pixel: leave color as-is
        setCurrentColor(c);
        addRecent(c);                        // picking counts as using it
      }
      break;
    }
  }
});

board.addEventListener('pointermove', e => {
  const cell = eventCell(e);
  if (!cell) {
    if (hoverCell) { hoverCell = null; if (!drawing) render(); }
    return;
  }
  if (drawing) {
    const color = tool === 'pencil' ? currentColor : null;
    // Interpolate between the last painted cell and this one.
    if (paintLine(lastCell, cell, color)) strokeChanged = true;
    lastCell = cell;
    render();
  } else if (!hoverCell || hoverCell[0] !== cell[0] || hoverCell[1] !== cell[1]) {
    hoverCell = cell;
    render();
  }
});

function endStroke() {
  if (!drawing) return;
  drawing = false;
  lastCell = null;
  if (strokeChanged) {
    commit();                                // whole drag = ONE history step
    if (tool === 'pencil') addRecent(currentColor); // recent colors update as you draw
  }
  strokeChanged = false;
  hoverCell = null;
  render();
}

board.addEventListener('pointerup', endStroke);
board.addEventListener('pointercancel', endStroke);
board.addEventListener('pointerleave', () => {
  hoverCell = null;
  if (!drawing) render();
});
board.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', endStroke);  // don't strand a stroke open

/* ================================================================
   Size switching (confirm + clear)
   ================================================================ */
function updateSizeButtons() {
  sizeSeg.querySelectorAll('button').forEach(el =>
    el.classList.toggle('active', parseInt(el.dataset.size, 10) === N));
}

function setSize(n) {
  if (n === N) return;
  if (!confirm('Switch to ' + n + '×' + n + '? This clears the current drawing.')) return;
  N = n;
  grid = new Array(N * N).fill(null);
  history = [grid.slice()];                  // fresh history for the new canvas
  historyIndex = 0;
  hoverCell = null;
  setupCanvasMetrics();
  updateSizeButtons();
  updateUndoRedoButtons();
  save();
  render();
}

/* ================================================================
   Clear & export
   ================================================================ */
function clearCanvas() {
  if (grid.every(v => v === null)) return;   // already empty
  if (!confirm('Clear the entire canvas? You can still undo this.')) return;
  grid.fill(null);
  commit();
}

function downloadPNG() {
  // Rebuild the N x N master and scale it EXPORT_SCALE x with smoothing
  // disabled. Transparent cells stay transparent in the PNG.
  const src = document.createElement('canvas');
  src.width = src.height = N;
  const sctx = src.getContext('2d');
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const c = grid[y * N + x];
      if (!c) continue;
      sctx.fillStyle = c;
      sctx.fillRect(x, y, 1, 1);
    }
  }
  const out = document.createElement('canvas');
  out.width = out.height = N * EXPORT_SCALE;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(src, 0, 0, N, N, 0, 0, N * EXPORT_SCALE, N * EXPORT_SCALE);

  out.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pixel-art-' + N + 'x' + N + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

/* ================================================================
   Global events: tool/size buttons, color input, keyboard
   ================================================================ */
document.querySelectorAll('.tool').forEach(el =>
  el.addEventListener('click', () => setTool(el.dataset.tool)));

sizeSeg.querySelectorAll('button').forEach(el =>
  el.addEventListener('click', () => setSize(parseInt(el.dataset.size, 10))));

gridToggle.addEventListener('change', () => {
  gridLines = gridToggle.checked;
  render();
});

colorPicker.addEventListener('input', () => setCurrentColor(colorPicker.value));

undoBtn.addEventListener('click', undo);
redoBtn.addEventListener('click', redo);
clearBtn.addEventListener('click', clearCanvas);
downloadBtn.addEventListener('click', downloadPNG);

window.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();

  // Undo / redo shortcuts (also Ctrl/Cmd+Y as a redo alias).
  if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }

  // Tool shortcuts (ignored while typing in an input).
  if (!mod && e.target.tagName !== 'INPUT') {
    const map = { p: 'pencil', e: 'eraser', f: 'fill', i: 'eyedropper' };
    if (map[k]) { e.preventDefault(); setTool(map[k]); }
  }
});

window.addEventListener('beforeunload', save);

/* ================================================================
   Init
   ================================================================ */
(function init() {
  load();                                     // restore size / grid / colors
  history = [grid.slice()];                   // restored art = step 0
  historyIndex = 0;
  setupCanvasMetrics();
  renderPalette();
  renderRecent();
  setCurrentColor(currentColor);
  updateSizeButtons();
  updateUndoRedoButtons();
  render();
})();
</script>
</body>
</html>
