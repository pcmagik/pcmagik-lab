<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Editor</title>
<style>
  /* ---------- Layout & theme ---------- */
  :root {
    --bg: #1e1f24;
    --panel: #2a2c33;
    --panel-2: #32343d;
    --border: #454855;
    --text: #e8e9ee;
    --muted: #9aa0b0;
    --accent: #5c8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 12px;
  }
  .app {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    align-items: flex-start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .group {
    display: flex;
    gap: 6px;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px;
  }
  button, select {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  button:disabled:hover { border-color: var(--border); }
  .tool-btn { display: flex; align-items: center; gap: 6px; }
  .tool-btn .icon { font-size: 15px; line-height: 1; }
  .tool-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .danger { color: #ff9b9b; }
  .danger:hover { border-color: #d05050; }
  .sep { width: 1px; height: 26px; background: var(--border); }

  /* ---------- Canvas ---------- */
  .canvas-wrap {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    line-height: 0;
  }
  canvas#board {
    display: block;
    width: 576px;   /* 576 / 16 = 36, /32 = 18, /64 = 9 → integer cell sizes, crisp edges */
    height: 576px;
    max-width: min(576px, calc(100vw - 60px));
    cursor: crosshair;
    border-radius: 4px;
    touch-action: none;
  }
  .status {
    position: absolute;
    right: 18px;
    bottom: 18px;
    background: rgba(20, 21, 26, .85);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--muted);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none;
  }

  /* ---------- Colors ---------- */
  .colors { width: 300px; display: flex; flex-direction: column; gap: 12px; }
  .colors h3 {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .current-row { display: flex; align-items: center; gap: 10px; }
  .current-swatch {
    width: 44px; height: 44px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: #e0312e;
    flex: none;
  }
  input[type="color"] {
    width: 44px; height: 44px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: none;
    cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
  .hex-label { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--muted); }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .swatch {
    aspect-ratio: 1;
    width: 100%;
    border: 2px solid rgba(255,255,255,.12);
    border-radius: 5px;
    cursor: pointer;
    padding: 0;
    transition: transform .08s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .recent { min-height: 24px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .recent .swatch { aspect-ratio: 1; }
  .hint { font-size: 11px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="app">

  <!-- ===================== Toolbar ===================== -->
  <div class="panel toolbar" role="toolbar" aria-label="Editor toolbar">
    <div class="group" id="tool-group">
      <button class="tool-btn active" data-tool="pencil"    title="Pencil (P)"><span class="icon">✏️</span>Pencil</button>
      <button class="tool-btn" data-tool="eraser"   title="Eraser (E)"><span class="icon">🧽</span>Eraser</button>
      <button class="tool-btn" data-tool="fill"     title="Fill bucket (F)"><span class="icon">🪣</span>Fill</button>
      <button class="tool-btn" data-tool="eyedrop"  title="Eyedropper (I)"><span class="icon">💉</span>Eyedrop</button>
    </div>

    <div class="group">
      <label for="grid-size">Grid</label>
      <select id="grid-size" title="Grid size">
        <option value="16">16 × 16</option>
        <option value="32">32 × 32</option>
        <option value="64">64 × 64</option>
      </select>
      <label class="check" title="Toggle grid overlay">
        <input type="checkbox" id="grid-toggle" checked> Grid
      </label>
    </div>

    <div class="group">
      <button id="undo-btn" title="Undo (Ctrl/Cmd+Z)">↩ Undo</button>
      <button id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)">↪ Redo</button>
      <div class="sep"></div>
      <button id="clear-btn" class="danger" title="Clear canvas">🗑 Clear</button>
      <button id="download-btn" title="Download as PNG">⬇ Download PNG</button>
    </div>
  </div>

  <!-- ===================== Canvas ===================== -->
  <div class="canvas-wrap">
    <canvas id="board" width="576" height="576" aria-label="Pixel art canvas"></canvas>
    <div class="status" id="status">–, –</div>
  </div>

  <!-- ===================== Colors ===================== -->
  <div class="panel colors">
    <div>
      <h3>Current color</h3>
      <div class="current-row">
        <div class="current-swatch" id="current-swatch"></div>
        <input type="color" id="color-picker" value="#e0312e" title="Pick a custom color">
        <span class="hex-label" id="hex-label">#e0312e</span>
      </div>
    </div>
    <div>
      <h3>Palette</h3>
      <div class="swatches" id="palette"></div>
    </div>
    <div>
      <h3>Recent</h3>
      <div class="recent" id="recent"></div>
      <p class="hint">Drag to draw. One stroke = one undo step. Ctrl/Cmd+Z undo, Ctrl/Cmd+Shift+Z redo.</p>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
 * Pixel Art Editor
 * - Logical drawing state: a flat array of `size*size` cells, each
 *   `null` (transparent) or a "#rrggbb" hex string.
 * - Rendering: state → 1px-per-cell offscreen canvas → scaled up with
 *   image smoothing DISABLED so pixel edges stay crisp at any size.
 * - History: full snapshots of the cell array (≤ 30 steps).
 * - Persistence: JSON in localStorage, restored on load.
 * =================================================================== */

// ---------------------------- Constants ----------------------------
const DISPLAY = 576;                 // canvas CSS/attribute size (divides evenly by 16, 32, 64)
const MAX_HISTORY = 30;              // ≥ 20 steps required
const RECENT_MAX = 8;
const STORAGE_KEY = "pixel-art-editor-v1";
const EXPORT_SCALE = 10;             // each pixel → 10×10 block in the PNG export

// 16 preset palette colors (classic-ish pixel palette)
const PALETTE = [
  "#000000", "#ffffff", "#7a7a7a", "#c9c9c9",
  "#e0312e", "#ff8b3d", "#ffd23f", "#7ed321",
  "#2ec27e", "#1e90ff", "#5c6dff", "#b061ff",
  "#ff5fa2", "#8b5a2b", "#f2e3c6", "#4d3b7a",
];

// ---------------------------- State --------------------------------
let gridSize = 16;
let pixels = new Array(gridSize * gridSize).fill(null); // drawing state
let tool = "pencil";
let currentColor = "#e0312e";
let recentColors = [];
let showGrid = true;
let painting = false;               // true while a stroke is in progress
let lastCell = null;                // last painted cell index (for interpolation)
let dirty = false;                  // unsaved-changes flag (drives confirm on size switch)

const undoStack = [];               // snapshots *before* the action
const redoStack = [];

// ---------------------------- Elements -----------------------------
const canvas  = document.getElementById("board");
const ctx     = canvas.getContext("2d");
const off     = document.createElement("canvas");   // 1px-per-cell offscreen buffer
const offCtx  = off.getContext("2d");
const statusEl  = document.getElementById("status");
const pickerEl  = document.getElementById("color-picker");
const swatchEl  = document.getElementById("current-swatch");
const hexEl     = document.getElementById("hex-label");
const paletteEl = document.getElementById("palette");
const recentEl  = document.getElementById("recent");
const sizeSel   = document.getElementById("grid-size");
const gridTgl   = document.getElementById("grid-toggle");

// ====================================================================
// Rendering
// ====================================================================
function render() {
  // 1) Write logical state to a 1px-per-cell offscreen canvas.
  off.width = gridSize;
  off.height = gridSize;
  const img = offCtx.createImageData(gridSize, gridSize);
  for (let i = 0; i < pixels.length; i++) {
    const c = pixels[i];
    const o = i * 4;
    if (c) {
      img.data[o]     = parseInt(c.slice(1, 3), 16);
      img.data[o + 1] = parseInt(c.slice(3, 5), 16);
      img.data[o + 2] = parseInt(c.slice(5, 7), 16);
      img.data[o + 3] = 255;
    } // transparent cells keep alpha = 0
  }
  offCtx.putImageData(img, 0, 0);

  // 2) Draw the display canvas: checkerboard, scaled art, grid overlay.
  const cell = DISPLAY / gridSize; // integer for 16/32/64 → crisp scaling
  ctx.clearRect(0, 0, DISPLAY, DISPLAY);

  // Checkerboard (2-cell squares) behind transparent pixels.
  const sq = cell * 2;
  for (let y = 0; y < gridSize; y += 2) {
    for (let x = 0; x < gridSize; x += 2) {
      ctx.fillStyle = ((x + y) / 2) % 2 === 0 ? "#d9d9de" : "#c2c2c8";
      ctx.fillRect(x * cell, y * cell, sq, sq);
    }
  }

  // The artwork itself — smoothing off keeps edges perfectly sharp.
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, DISPLAY, DISPLAY);

  // Subtle grid overlay, snapped to half-pixels for 1px lines.
  if (showGrid) {
    ctx.strokeStyle = "rgba(0,0,0,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < gridSize; i++) {
      const p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0);  ctx.lineTo(p, DISPLAY);
      ctx.moveTo(0, p);  ctx.lineTo(DISPLAY, p);
    }
    ctx.stroke();
  }
  ctx.imageSmoothingEnabled = false; // leave it off for any future draws
}

// ====================================================================
// Painting tools
// ====================================================================
function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width  * gridSize);
  const y = Math.floor((e.clientY - r.top)  / r.height * gridSize);
  if (x < 0 || y < 0 || x >= gridSize || y >= gridSize) return null;
  return y * gridSize + x;
}

function paintCell(i, color) {
  if (pixels[i] === color) return false;
  pixels[i] = color;
  return true;
}

/** Paint a straight line between two cell indices so fast drags don't leave gaps. */
function paintLine(a, b, color) {
  bresenham(a % gridSize, Math.floor(a / gridSize),
            b % gridSize, Math.floor(b / gridSize), color);
}

/** Bresenham line walk between two cells (inclusive of both endpoints). */
function bresenham(x0, y0, x1, y1, color) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  while (true) {
    paintCell(y0 * gridSize + x0, color);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 <  dx) { err += dx; y0 += sy; }
  }
}

/** Iterative flood fill (BFS) — safe on 64×64, no recursion, no overflow. */
function floodFill(startIdx, fillColor) {
  const target = pixels[startIdx];
  if (target === fillColor) return;

  pushHistory();
  dirty = true;

  const n = gridSize;
  const queue = [startIdx];
  let head = 0;
  while (head < queue.length) {
    const i = queue[head++];
    if (pixels[i] !== target) continue; // already painted (or different color)
    pixels[i] = fillColor;

    const x = i % n;
    if (x > 0)        queue.push(i - 1);
    if (x < n - 1)    queue.push(i + 1);
    if (i - n >= 0)   queue.push(i - n);
    if (i + n < n * n) queue.push(i + n);
  }
  render();
  save();
  addRecent(fillColor);
}

function eyedrop(i) {
  const c = pixels[i];
  if (!c) return; // transparent pixel → nothing to pick
  setCurrentColor(c);
  tool = "pencil"; // sensible follow-up: ready to keep painting
  syncToolButtons();
}

// ====================================================================
// Undo / Redo (full snapshots; a whole stroke = one step)
// ====================================================================
function snapshot() { return pixels.slice(); }

function pushHistory() {
  undoStack.push(snapshot());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0; // any new action invalidates the redo branch
  updateHistoryButtons();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  pixels = undoStack.pop();
  dirty = true;
  render(); save(); updateHistoryButtons();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  pixels = redoStack.pop();
  dirty = true;
  render(); save(); updateHistoryButtons();
}

function updateHistoryButtons() {
  document.getElementById("undo-btn").disabled = undoStack.length === 0;
  document.getElementById("redo-btn").disabled = redoStack.length === 0;
}

// ====================================================================
// Colors
// ====================================================================
function setCurrentColor(c) {
  currentColor = c.toLowerCase();
  pickerEl.value = currentColor;
  swatchEl.style.background = currentColor;
  hexEl.textContent = currentColor;
  refreshSwatchHighlights();
}

function addRecent(c) {
  if (!c) return; // e.g. eraser strokes don't add colors
  c = c.toLowerCase();
  recentColors = [c, ...recentColors.filter(x => x !== c)].slice(0, RECENT_MAX);
  renderRecent();
}

function buildSwatches(container, colors, clickable = true) {
  container.innerHTML = "";
  for (const c of colors) {
    const b = document.createElement("button");
    b.className = "swatch";
    b.style.background = c;
    b.title = c;
    b.dataset.color = c;
    b.addEventListener("click", () => {
      setCurrentColor(c);
      addRecent(c);
      if (tool === "eraser" || tool === "eyedrop") { tool = "pencil"; syncToolButtons(); }
    });
    container.appendChild(b);
  }
}

function refreshSwatchHighlights() {
  for (const el of document.querySelectorAll(".swatch")) {
    el.classList.toggle("active", el.dataset.color === currentColor);
  }
}

function renderRecent() {
  buildSwatches(recentEl, recentColors.length ? recentColors : []);
  refreshSwatchHighlights();
}

// ====================================================================
// Tools UI
// ====================================================================
function setTool(t) { tool = t; syncToolButtons(); }

function syncToolButtons() {
  document.querySelectorAll(".tool-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.tool === tool));
}

// ====================================================================
// Persistence & export
// ====================================================================
function save() {
  try {
    localStorage.setItem(STORAGE_KEY,
      JSON.stringify({ size: gridSize, pixels: pixels }));
  } catch (e) { /* storage may be unavailable; editor still works */ }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.pixels) ||
        ![16, 32, 64].includes(data.size) ||
        data.pixels.length !== data.size * data.size) return false;
    gridSize = data.size;
    pixels = data.pixels.map(c => (c && /^#[0-9a-f]{6}$/i.test(c)) ? c.toLowerCase() : null);
    return true;
  } catch (e) { return false; }
}

function clearCanvas() {
  pushHistory();
  pixels.fill(null);
  dirty = true;
  render(); save();
}

function downloadPNG() {
  const s = gridSize * EXPORT_SCALE;
  const c = document.createElement("canvas");
  c.width = s; c.height = s;
  const g = c.getContext("2d");
  for (let i = 0; i < pixels.length; i++) {
    if (!pixels[i]) continue; // transparency preserved
    g.fillStyle = pixels[i];
    g.fillRect((i % gridSize) * EXPORT_SCALE,
               Math.floor(i / gridSize) * EXPORT_SCALE,
               EXPORT_SCALE, EXPORT_SCALE);
  }
  const a = document.createElement("a");
  a.download = `pixel-art-${gridSize}x${gridSize}.png`;
  a.href = c.toDataURL("image/png");
  a.click();
}

// ====================================================================
// Event wiring
// ====================================================================
// --- Tools ---
document.getElementById("tool-group").addEventListener("click", e => {
  const b = e.target.closest(".tool-btn");
  if (b) setTool(b.dataset.tool);
});

// --- Color UI ---
pickerEl.addEventListener("input", () => setCurrentColor(pickerEl.value));

// --- Grid controls ---
gridTgl.addEventListener("change", () => { showGrid = gridTgl.checked; render(); });

sizeSel.addEventListener("change", () => {
  const newSize = parseInt(sizeSel.value, 10);
  if (newSize === gridSize) return;
  if (dirty && !confirm("Changing the grid size clears the drawing. Continue?")) {
    sizeSel.value = String(gridSize);
    return;
  }
  gridSize = newSize;
  pixels = new Array(gridSize * gridSize).fill(null);
  undoStack.length = 0;
  redoStack.length = 0;
  dirty = false;
  render(); save(); updateHistoryButtons();
});

// --- History / file actions ---
document.getElementById("undo-btn").addEventListener("click", undo);
document.getElementById("redo-btn").addEventListener("click", redo);
document.getElementById("clear-btn").addEventListener("click", () => {
  if (confirm("Clear the entire canvas?")) clearCanvas();
});
document.getElementById("download-btn").addEventListener("click", downloadPNG);

// --- Drawing (click + drag) ---
canvas.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const i = cellFromEvent(e);
  if (i === null) return;

  if (tool === "fill") {
    floodFill(i, currentColor);
    return;
  }
  if (tool === "eyedrop") {
    eyedrop(i);
    return;
  }
  // Pencil / eraser: begin a stroke — one undo step for the whole drag.
  pushHistory();
  dirty = true;
  painting = true;
  lastCell = i;
  paintCell(i, tool === "eraser" ? null : currentColor);
  if (tool !== "eraser") addRecent(currentColor); // track recent colors while drawing
  render();
});

canvas.addEventListener("mousemove", e => {
  const i = cellFromEvent(e);
  statusEl.textContent = i === null ? "–, –"
    : `${(i % gridSize) + 1}, ${Math.floor(i / gridSize) + 1}`;
  if (!painting || i === null) return;
  paintLine(lastCell === null ? i : lastCell, i,
            tool === "eraser" ? null : currentColor);
  lastCell = i;
  render();
});

function endStroke() {
  if (painting) { painting = false; lastCell = null; save(); }
}
canvas.addEventListener("mouseleave", () => { if (painting) { painting = false; lastCell = null; } });
window.addEventListener("mouseup", endStroke);

// --- Keyboard shortcuts ---
window.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if (mod && k === "z") {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  } else if (mod && k === "y") {
    e.preventDefault();
    redo();
  } else if (!mod) {
    if (k === "p") setTool("pencil");
    else if (k === "e") setTool("eraser");
    else if (k === "f") setTool("fill");
    else if (k === "i") setTool("eyedrop");
  }
});

// ====================================================================
// Init
// ====================================================================
function init() {
  if (load()) sizeSel.value = String(gridSize); // restored from localStorage
  buildSwatches(paletteEl, PALETTE);
  renderRecent();
  setCurrentColor(currentColor);
  updateHistoryButtons();
  render();
}
init();
</script>
</body>
</html>
