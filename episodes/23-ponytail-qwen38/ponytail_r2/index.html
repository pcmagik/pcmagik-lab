<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Editor</title>
<style>
  :root {
    --bg: #1e1f26;
    --panel: #2a2c36;
    --border: #3d4050;
    --text: #e8e9ef;
    --accent: #29adff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 { font-size: 1.2rem; margin: 4px 0 12px; font-weight: 600; }
  .app {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9a9db0;
    margin-bottom: 6px;
  }
  .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    font: inherit;
    color: var(--text);
    background: #353848;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    cursor: pointer;
  }
  button:hover { background: #40435a; }
  button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #06121f;
    font-weight: 600;
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  .swatch {
    aspect-ratio: 1;
    border: 2px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
  }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .color-row { display: flex; gap: 8px; align-items: center; }
  input[type="color"] {
    width: 42px; height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none; padding: 2px; cursor: pointer;
  }
  #currentColor {
    flex: 1;
    height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  canvas {
    display: block;
    width: 480px;
    height: 480px;
    max-width: 80vw;
    max-height: 80vw;
    border-radius: 6px;
    cursor: crosshair;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  select {
    font: inherit;
    color: var(--text);
    background: #353848;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
  }
  .hint { font-size: 0.7rem; color: #9a9db0; }
</style>
</head>
<body>
<h1>Pixel Art Editor</h1>
<div class="app">
  <div class="sidebar">
    <div>
      <div class="section-label">Tools</div>
      <div class="toolbar" id="toolbar">
        <button data-tool="pencil"   class="active">Pencil</button>
        <button data-tool="eraser">Eraser</button>
        <button data-tool="fill">Fill</button>
        <button data-tool="picker">Eyedropper</button>
      </div>
    </div>
    <div>
      <div class="section-label">Color</div>
      <div class="color-row">
        <input type="color" id="colorPicker" value="#ff004d">
        <div id="currentColor" style="background:#ff004d"></div>
      </div>
    </div>
    <div>
      <div class="section-label">Palette</div>
      <div class="swatches" id="palette"></div>
    </div>
    <div>
      <div class="section-label">Recent colors</div>
      <div class="swatches" id="recent" style="grid-template-columns:repeat(8,1fr)"></div>
    </div>
    <div>
      <div class="section-label">Canvas</div>
      <div class="row" style="align-items:center">
        <select id="sizeSelect">
          <option value="16" selected>16 × 16</option>
          <option value="32">32 × 32</option>
          <option value="64">64 × 64</option>
        </select>
      </div>
      <div style="margin-top:8px">
        <label style="font-size:0.85rem; display:flex; gap:6px; align-items:center; cursor:pointer">
          <input type="checkbox" id="gridToggle" checked> Show grid
        </label>
      </div>
    </div>
    <div>
      <div class="section-label">Actions</div>
      <div class="row">
        <button id="undoBtn" title="Ctrl/Cmd+Z">Undo</button>
        <button id="redoBtn" title="Ctrl/Cmd+Shift+Z">Redo</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="downloadBtn">Download PNG</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
    <div class="hint">Click or drag to draw. One drag = one undo step.</div>
  </div>
  <div class="canvas-wrap">
    <canvas id="canvas" width="512" height="512"></canvas>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const STORAGE_KEY = "pixel-art-editor-v1";
const CANVAS_PX = 512;              // internal canvas resolution (crisp at all sizes)
const PALETTE = [
  "#000000", "#1d2b53", "#7e2553", "#008751", "#ab5236", "#5f574f",
  "#c2c3c7", "#fff1e8", "#ff004d", "#ffa300", "#ffec27", "#00e436",
  "#29adff", "#83769c", "#ff77a8", "#ffccaa",
];

let grid = 16;                      // grid size (16, 32, or 64)
let pixels = new Array(grid * grid).fill("");  // "" = transparent, else "#rrggbb"
let tool = "pencil";
let currentColor = "#ff004d";
let showGrid = true;
let recent = [];                    // up to 8 recently used colors

// Undo/redo: history holds pixel snapshots; historyIndex points at "now".
const HISTORY_LIMIT = 60;
let history = [];
let historyIndex = -1;

// ---------------------------------------------------------------------------
// Canvas setup
// ---------------------------------------------------------------------------
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Offscreen buffer at exactly grid×grid; scaling it with smoothing disabled
// gives perfectly crisp pixel edges (no anti-aliasing).
const buffer = document.createElement("canvas");
const bctx = buffer.getContext("2d");

function resizeBuffer() {
  buffer.width = grid;
  buffer.height = grid;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function render() {
  // 1. Draw the artwork into the 1px-per-pixel buffer.
  bctx.clearRect(0, 0, grid, grid);
  const img = bctx.createImageData(grid, grid);
  for (let i = 0; i < pixels.length; i++) {
    const c = pixels[i];
    const o = i * 4;
    if (c) {
      img.data[o]     = parseInt(c.slice(1, 3), 16);
      img.data[o + 1] = parseInt(c.slice(3, 5), 16);
      img.data[o + 2] = parseInt(c.slice(5, 7), 16);
      img.data[o + 3] = 255;
    }
  }
  bctx.putImageData(img, 0, 0);

  // 2. Checkerboard background (shows through transparent pixels).
  const scale = CANVAS_PX / grid;   // integer for 16/32/64 → crisp blocks
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? "#c9c9d1" : "#a9a9b5";
      ctx.fillRect(x * scale, y * scale, scale, scale);
    }
  }

  // 3. Artwork, scaled up with smoothing off → no anti-alias artifacts.
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buffer, 0, 0, grid, grid, 0, 0, CANVAS_PX, CANVAS_PX);

  // 4. Optional grid overlay (1px lines on integer boundaries → crisp).
  if (showGrid) {
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= grid; i++) {
      const p = i * scale;
      ctx.moveTo(p + 0.5, 0);
      ctx.lineTo(p + 0.5, CANVAS_PX);
      ctx.moveTo(0, p + 0.5);
      ctx.lineTo(CANVAS_PX, p + 0.5);
    }
    ctx.stroke();
  }
}

// ---------------------------------------------------------------------------
// Tools
// ---------------------------------------------------------------------------
function paint(x, y, color) {
  const i = y * grid + x;
  if (pixels[i] !== color) {
    pixels[i] = color;
    save();
  }
}

function floodFill(x, y) {
  // Iterative BFS with an explicit stack — never recurses, safe on 64×64.
  const target = pixels[y * grid + x];
  if (target === currentColor) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    // 4-connected neighbourhood, clipped to the grid.
    const nbs = [[cx - 1, cy], [cx + 1, cy], [cx, cy - 1], [cx, cy + 1]];
    for (const [nx, ny] of nbs) {
      if (nx < 0 || ny < 0 || nx >= grid || ny >= grid) continue;
      const i = ny * grid + nx;
      if (pixels[i] === target) {
        pixels[i] = currentColor;
        stack.push([nx, ny]);
      }
    }
  }
  save();
}

function pick(x, y) {
  const c = pixels[y * grid + x];
  if (c) setColor(c, true);
  // transparent pixels are ignored
}

// ---------------------------------------------------------------------------
// Color handling
// ---------------------------------------------------------------------------
const colorPicker = document.getElementById("colorPicker");
const currentColorEl = document.getElementById("currentColor");
const paletteEl = document.getElementById("palette");
const recentEl = document.getElementById("recent");

function setColor(color, recordRecent) {
  currentColor = color.toLowerCase();
  colorPicker.value = currentColor;
  currentColorEl.style.background = currentColor;
  if (recordRecent) {
    recent = [currentColor, ...recent.filter(c => c !== currentColor)].slice(0, 8);
    save();
  }
  renderSwatches();
}

function renderSwatches() {
  paletteEl.innerHTML = "";
  for (const c of PALETTE) {
    const b = document.createElement("button");
    b.className = "swatch" + (c === currentColor ? " active" : "");
    b.style.background = c;
    b.title = c;
    b.onclick = () => setColor(c, true);
    paletteEl.appendChild(b);
  }
  recentEl.innerHTML = "";
  for (const c of recent) {
    const b = document.createElement("button");
    b.className = "swatch" + (c === currentColor ? " active" : "");
    b.style.background = c;
    b.title = c;
    b.onclick = () => setColor(c, false);
    recentEl.appendChild(b);
  }
}

colorPicker.addEventListener("input", () => setColor(colorPicker.value, true));

// ---------------------------------------------------------------------------
// Toolbar
// ---------------------------------------------------------------------------
const toolbar = document.getElementById("toolbar");
toolbar.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tool]");
  if (!btn) return;
  tool = btn.dataset.tool;
  for (const b of toolbar.querySelectorAll("button")) {
    b.classList.toggle("active", b === btn);
  }
});

// ---------------------------------------------------------------------------
// Undo / Redo
// ---------------------------------------------------------------------------
function commit() {
  // Snapshot current state BEFORE a change, truncating any redo branch.
  history = history.slice(0, historyIndex + 1);
  history.push(pixels.slice());
  if (history.length > HISTORY_LIMIT) history.shift();
  historyIndex = history.length - 1;
  save();
}

function undo() {
  if (historyIndex <= 0) return;
  historyIndex--;
  pixels = history[historyIndex].slice();
  save();
  render();
}

function redo() {
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  pixels = history[historyIndex].slice();
  save();
  render();
}

document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod || e.key.toLowerCase() !== "z") return;
  e.preventDefault();
  if (e.shiftKey) redo();
  else undo();
});

// ---------------------------------------------------------------------------
// Mouse drawing (click + drag)
// ---------------------------------------------------------------------------
let drawing = false;
let lastCell = null;

function cellAt(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / rect.width * grid);
  const y = Math.floor((e.clientY - rect.top) / rect.height * grid);
  if (x < 0 || y < 0 || x >= grid || y >= grid) return null;
  return [x, y];
}

canvas.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  const cell = cellAt(e);
  if (!cell) return;
  const [x, y] = cell;

  if (tool === "fill") { floodFill(x, y); return; }
  if (tool === "picker") { pick(x, y); return; }

  // Pencil/eraser: commit once per stroke → one drag = one undo step.
  commit();
  if (tool === "pencil") {
    // Record the color when a stroke actually paints it.
    if (!recent.includes(currentColor)) {
      recent = [currentColor, ...recent].slice(0, 8);
      save();
      renderSwatches();
    }
  }
  drawing = true;
  lastCell = cell;
  paint(x, y, tool === "eraser" ? "" : currentColor);
  render();
});

canvas.addEventListener("mousemove", (e) => {
  if (!drawing) return;
  const cell = cellAt(e);
  if (!cell) return;
  const [x, y] = cell;
  const color = tool === "eraser" ? "" : currentColor;
  // Bridge gaps between fast mouse events (Bresenham between last and new cell).
  if (lastCell) {
    let [cx, cy] = lastCell;
    while (cx !== x || cy !== y) {
      cx += Math.sign(x - cx);
      cy += Math.sign(y - cy);
      paint(cx, cy, color);
    }
  }
  paint(x, y, color);
  lastCell = cell;
  render();
});

window.addEventListener("mouseup", () => { drawing = false; lastCell = null; });

// ---------------------------------------------------------------------------
// Size, grid toggle, clear
// ---------------------------------------------------------------------------
document.getElementById("sizeSelect").addEventListener("change", (e) => {
  const newSize = parseInt(e.target.value, 10);
  if (newSize === grid) return;
  if (!confirm(`Changing to ${newSize}×${newSize} will clear your drawing. Continue?`)) {
    e.target.value = grid;
    return;
  }
  grid = newSize;
  pixels = new Array(grid * grid).fill("");
  resizeBuffer();
  history = [];
  historyIndex = -1;
  commit();
  save();
  render();
});

document.getElementById("gridToggle").addEventListener("change", (e) => {
  showGrid = e.target.checked;
  render();
});

document.getElementById("clearBtn").onclick = () => {
  if (!confirm("Clear the whole canvas?")) return;
  commit();
  pixels = new Array(grid * grid).fill("");
  save();
  render();
};

// ---------------------------------------------------------------------------
// Export & persistence
// ---------------------------------------------------------------------------
document.getElementById("downloadBtn").onclick = () => {
  // Export at 10× per pixel, preserving transparency.
  const scale = 10;
  const out = document.createElement("canvas");
  out.width = grid * scale;
  out.height = grid * scale;
  const octx = out.getContext("2d");
  octx.imageSmoothingEnabled = false;
  octx.drawImage(buffer, 0, 0, grid, grid, 0, 0, out.width, out.height);
  const a = document.createElement("a");
  a.download = "pixel-art.png";
  a.href = out.toDataURL("image/png");
  a.click();
};

function save() {
  // Auto-save the whole document state.
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      grid, pixels, recent, currentColor, showGrid,
    }));
  } catch (_) { /* storage unavailable — ignore */ }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.grid === 16 || s.grid === 32 || s.grid === 64) grid = s.grid;
    if (Array.isArray(s.pixels) && s.pixels.length === grid * grid) {
      pixels = s.pixels.map(c => (typeof c === "string" && c.startsWith("#")) ? c : "");
    }
    if (Array.isArray(s.recent)) recent = s.recent.slice(0, 8);
    if (typeof s.currentColor === "string") currentColor = s.currentColor;
    if (typeof s.showGrid === "boolean") showGrid = s.showGrid;
  } catch (_) { /* corrupt save — start fresh */ }
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
load();
resizeBuffer();
document.getElementById("sizeSelect").value = grid;
document.getElementById("gridToggle").checked = showGrid;
setColor(currentColor, false);
history = [];
historyIndex = -1;
commit(); // empty history entry = the loaded (or blank) state
render();
</script>
</body>
</html>
