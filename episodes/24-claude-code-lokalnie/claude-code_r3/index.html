<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Art Editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<style>
  :root{
    --bg:#f3f4f8;
    --panel:#ffffff;
    --border:#e2e4ea;
    --text:#1f2330;
    --muted:#6b7080;
    --accent:#4f6bff;
    --accent-soft:#eef1ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:1080px; margin:0 auto; padding:24px 20px 64px; }
  header{ margin-bottom:20px; }
  h1{ font-size:24px; margin:0; letter-spacing:-.01em; }
  .subtitle{ color:var(--muted); margin:6px 0 0; font-size:14px; }

  .workspace{ display:flex; gap:20px; align-items:flex-start; }

  /* Canvas area */
  .canvas-panel{
    flex:1; display:flex; justify-content:center;
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:18px; box-shadow:0 1px 3px rgba(20,30,60,.05);
    min-height:100%;
  }
  .canvas-wrap{
    line-height:0; border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 10px 30px rgba(20,30,60,.12);
  }
  canvas{
    cursor:crosshair; touch-action:none; display:block;
    max-width:100%; height:auto; user-select:none; -webkit-user-select:none;
  }

  /* Controls column */
  .controls{ width:268px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .card h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin:0 0 12px; font-weight:700;
  }

  .field{ display:block; }
  .field-label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:9px;
    background:#fff; color:var(--text); font-size:14px; cursor:pointer;
  }
  select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .check{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; cursor:pointer; user-select:none; }
  .check input{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }

  /* Tools */
  .tools{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .tool{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:9px 4px; border:1px solid var(--border); border-radius:10px;
    background:#fff; color:var(--muted); cursor:pointer; font-size:11px; font-weight:600;
    transition:background .15s, border-color .15s, color .15s;
  }
  .tool svg{ width:20px; height:20px; }
  .tool:hover{ border-color:#c9cede; color:var(--text); }
  .tool.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  /* Color */
  .current-row{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .color-swatch-big{ width:36px; height:36px; border-radius:9px; border:1px solid rgba(0,0,0,.16); flex-shrink:0; }
  .current-meta{ flex:1; min-width:0; }
  .hex{ font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=color]{
    width:46px; height:36px; border:1px solid var(--border); border-radius:9px;
    padding:2px; background:#fff; cursor:pointer;
  }
  .swatch{
    width:100%; aspect-ratio:1/1; border-radius:8px; border:1px solid rgba(0,0,0,.14);
    cursor:pointer; padding:0;
  }
  .swatch:hover{ box-shadow:0 0 0 2px var(--accent-soft); }
  .palette{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
  .recent-label{ font-size:12px; color:var(--muted); margin:14px 0 7px; }
  .recent-row{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; align-items:center; }
  .muted{ color:var(--muted); } .small{ font-size:12px; }

  /* Actions */
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn{
    padding:10px 12px; border:1px solid var(--border); border-radius:10px;
    background:#fff; color:var(--text); cursor:pointer; font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover{ border-color:#c9cede; background:#f7f8fc; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:#3f5bff; border-color:#3f5bff; }
  .btn.danger{ color:#d64545; }
  .btn.danger:hover{ background:#fdf1f1; border-color:#f0c4c4; }

  .hints{ font-size:12px; color:var(--muted); line-height:1.7; }
  .hints kbd{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    background:#f1f2f7; border:1px solid var(--border); border-bottom-width:2px;
    border-radius:5px; padding:1px 5px; color:var(--text);
  }

  @media (max-width:840px){
    .workspace{ flex-direction:column; align-items:stretch; }
    .controls{ width:auto; }
    .canvas-panel{ padding:12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Pixel Art Editor</h1>
    <p class="subtitle">A tiny canvas, a flood-fill bucket, and undo — everything you need to sketch pixel art.</p>
  </header>

  <div class="workspace">
    <!-- Canvas -->
    <section class="canvas-panel">
      <div class="canvas-wrap">
        <canvas id="canvas" draggable="false" aria-label="Pixel art canvas"></canvas>
      </div>
    </section>

    <!-- Controls -->
    <aside class="controls">

      <div class="card">
        <h2>Canvas</h2>
        <label class="field">
          <span class="field-label">Grid size</span>
          <select id="sizeSelect" title="Change grid size (clears the drawing)">
            <option value="16">16 × 16</option>
            <option value="32">32 × 32</option>
            <option value="64">64 × 64</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="gridToggle" checked>
          <span>Show grid lines</span>
        </label>
      </div>

      <div class="card">
        <h2>Tools</h2>
        <div class="tools" role="toolbar" aria-label="Drawing tools">
          <button class="tool active" data-tool="pencil" title="Pencil — paint with the current color (B)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            <span>Pencil</span>
          </button>
          <button class="tool" data-tool="eraser" title="Eraser — make pixels transparent (E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l5 5-9 9H7l-4-4z"/><path d="M7 21h12"/></svg>
            <span>Eraser</span>
          </button>
          <button class="tool" data-tool="fill" title="Fill — flood-fill the region (F)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3l9 9-6 6-9-9z"/><path d="M9 3l2-2"/><path d="M19 14c1.8 1.8 1.8 4.2 0 6-1.8-1.8-1.8-4.2 0-6z"/></svg>
            <span>Fill</span>
          </button>
          <button class="tool" data-tool="eyedropper" title="Eyedropper — pick a pixel's color (I)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3l3 3-8 8-3-3z"/><path d="M10 11l-5 5"/><path d="M5 16l-2 5 5-2"/><path d="M15 6l3 3"/></svg>
            <span>Pick</span>
          </button>
        </div>
      </div>

      <div class="card">
        <h2>Color</h2>
        <div class="current-row">
          <div class="color-swatch-big" id="colorSwatch"></div>
          <div class="current-meta">
            <div class="muted small">Current color</div>
            <div class="hex" id="colorHex">#4f6bff</div>
          </div>
          <input type="color" id="colorInput" value="#4f6bff" title="Pick a custom color">
        </div>
        <div class="palette" id="palette"></div>
        <div class="recent-label">Recent</div>
        <div class="recent-row" id="recents"></div>
      </div>

      <div class="card">
        <h2>Actions</h2>
        <div class="actions">
          <button class="btn" id="undoBtn" title="Undo (Ctrl/Cmd + Z)">↶ Undo</button>
          <button class="btn" id="redoBtn" title="Redo (Ctrl/Cmd + Shift + Z)">↷ Redo</button>
          <button class="btn danger" id="clearBtn" title="Clear the whole canvas">Clear</button>
          <button class="btn primary" id="downloadBtn" title="Download the artwork as a PNG">Download PNG</button>
        </div>
      </div>

      <div class="card">
        <div class="hints">
          <div><kbd>B</kbd> Pencil · <kbd>E</kbd> Eraser · <kbd>F</kbd> Fill · <kbd>I</kbd> Pick</div>
          <div><kbd>Ctrl</kbd>/<kbd>⌘</kbd><kbd>Z</kbd> Undo · <kbd>Shift</kbd> Redo</div>
          <div>Your drawing auto-saves to this browser.</div>
        </div>
      </div>

    </aside>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  Configuration
 * ------------------------------------------------------------------ */
const CELL = 10;                 // CSS pixels per grid cell (keeps everything integer → crisp)
const SIZES = [16, 32, 64];      // selectable grid sizes
const TOOLS = ['pencil', 'eraser', 'fill', 'eyedropper'];
const MAX_HISTORY = 50;          // ≥ 20 undo/redo steps (capped for memory)
const LS_KEY = 'pixel-art-editor-v1';
const EXPORT_SCALE = 10;         // PNG export: each grid pixel → 10×10 blocks

/* A curated 16-color palette. */
const PALETTE = [
  '#000000', '#ffffff', '#8a8a8a', '#d0d0d0',
  '#e63946', '#f77f00', '#fcbf49', '#2a9d8f',
  '#4361ee', '#3a0ca3', '#7209b7', '#f72585',
  '#582f0e', '#264653', '#4cc9f0', '#80b918'
];

/* ------------------------------------------------------------------ *
 *  State
 * ------------------------------------------------------------------ */
// `pixels` is a flat array of length size*size.
//   each entry is `null` (transparent) OR a `#rrggbb` string (opaque).
let size = 32;
let pixels = new Array(size * size).fill(null);

let currentTool = 'pencil';
let gridOn = true;
let color = '#4f6bff';           // the current drawing color
let recents = [];               // up to 8 most-recently-used colors

let drawing = false;            // true while a pencil/eraser stroke is in progress
let lastCell = null;            // last cell painted, used to interpolate fast drags

const undoStack = [];           // snapshots (arrays) taken BEFORE an action
const redoStack = [];

/* ------------------------------------------------------------------ *
 *  DOM references
 * ------------------------------------------------------------------ */
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const off         = document.createElement('canvas');   // size×size offscreen (1px = 1 cell)
const offCtx      = off.getContext('2d');

const sizeSelect  = document.getElementById('sizeSelect');
const gridToggle  = document.getElementById('gridToggle');
const toolButtons = Array.from(document.querySelectorAll('.tool'));

const colorInput  = document.getElementById('colorInput');
const colorSwatch = document.getElementById('colorSwatch');
const colorHex    = document.getElementById('colorHex');
const paletteEl   = document.getElementById('palette');
const recentsEl   = document.getElementById('recents');

const undoBtn     = document.getElementById('undoBtn');
const redoBtn     = document.getElementById('redoBtn');
const clearBtn    = document.getElementById('clearBtn');
const downloadBtn = document.getElementById('downloadBtn');

/* ------------------------------------------------------------------ *
 *  Small color helpers
 * ------------------------------------------------------------------ */
// "#rrggbb" -> {r,g,b} (integers 0–255)
function hexToRgb(hex){
  const h = hex.replace('#','');
  return {
    r: parseInt(h.substring(0,2), 16),
    g: parseInt(h.substring(2,4), 16),
    b: parseInt(h.substring(4,6), 16)
  };
}

/* ------------------------------------------------------------------ *
 *  Canvas setup & rendering
 *
 *  Crispness strategy: we keep the artwork in a `size × size` offscreen
 *  canvas (one physical pixel per grid cell) and blit it up with
 *  imageSmoothingEnabled = false (nearest-neighbour). Because the scale
 *  factor (CELL) is an integer and the backing store is sized by
 *  devicePixelRatio, pixel edges land on hard device-pixel boundaries —
 *  no anti-aliasing at any grid size.
 * ------------------------------------------------------------------ */
function setupCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const cssSize = size * CELL;

  off.width = size;                 // offscreen = exactly one pixel per cell
  off.height = size;

  canvas.width  = Math.round(cssSize * dpr);   // device pixels
  canvas.height = Math.round(cssSize * dpr);
  canvas.style.width  = cssSize + 'px';        // CSS pixels
  canvas.style.height = cssSize + 'px';
}

// Paint the size×size offscreen canvas from the `pixels` array.
function updateOffscreen(){
  const img = offCtx.createImageData(size, size);
  const d = img.data;
  for (let i = 0; i < size * size; i++){
    const c = pixels[i];
    const p = i * 4;
    if (c){
      const {r,g,b} = hexToRgb(c);
      d[p] = r; d[p+1] = g; d[p+2] = b; d[p+3] = 255;
    } else {
      d[p] = 0; d[p+1] = 0; d[p+2] = 0; d[p+3] = 0;   // transparent
    }
  }
  offCtx.putImageData(img, 0, 0);
}

// Light checkerboard that stands in for "transparency".
function drawCheckerboard(){
  const cellD = canvas.width / size;
  const w = Math.ceil(cellD) + 1;   // +1 hides hairline seams between squares
  for (let r = 0; r < size; r++){
    for (let c = 0; c < size; c++){
      ctx.fillStyle = ((r + c) % 2 === 0) ? '#ffffff' : '#ececec';
      ctx.fillRect(c * cellD, r * cellD, w, w);
    }
  }
}

// Subtle grid lines, snapped to whole device pixels so they stay 1px thick.
function drawGrid(){
  const cellD = canvas.width / size;
  ctx.strokeStyle = 'rgba(0,0,0,0.14)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= size; i++){
    const p = Math.round(i * cellD);
    ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height);
    ctx.moveTo(0, p); ctx.lineTo(canvas.width, p);
  }
  ctx.stroke();
}

// Full redraw: checkerboard → artwork (transparent parts let the board show) → grid.
function render(){
  updateOffscreen();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCheckerboard();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
  if (gridOn) drawGrid();
}

/* ------------------------------------------------------------------ *
 *  Coordinate mapping
 * ------------------------------------------------------------------ */
function eventToCell(e){
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return null;
  const x = (e.clientX - rect.left) * (canvas.width  / rect.width);
  const y = (e.clientY - rect.top)  * (canvas.height / rect.height);
  const cellD = canvas.width / size;
  const col = Math.floor(x / cellD);
  const row = Math.floor(y / cellD);
  if (col < 0 || col >= size || row < 0 || row >= size) return null;
  return { col, row };
}

/* ------------------------------------------------------------------ *
 *  Painting primitives
 * ------------------------------------------------------------------ */
function paintCell(col, row, value){
  if (col < 0 || col >= size || row < 0 || row >= size) return;
  pixels[row * size + col] = value;   // `value` is a color string or null (eraser)
}

// Bresenham line so fast drags don't leave gaps between cells.
function paintLine(x0, y0, x1, y1, value){
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  for(;;){
    paintCell(x0, y0, value);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy){ err -= dy; x0 += sx; }
    if (e2 <  dx){ err += dx; y0 += sy; }
  }
}

/*
 * Flood-fill (iterative, explicit stack → no recursion, no stack overflow).
 * Replaces the contiguous region of `target` color with `replacement`.
 */
function floodFill(startCol, startRow){
  const target = pixels[startRow * size + startCol];
  const replacement = color;               // fill always paints the current color
  if (target === replacement) return;      // nothing to do

  const visited = new Uint8Array(size * size);
  const stack = [startRow * size + startCol];
  visited[stack[0]] = 1;

  while (stack.length){
    const i = stack.pop();
    pixels[i] = replacement;
    const c = i % size;
    const r = (i - c) / size;

    if (c > 0)          pushIfMatch(i - 1);
    if (c < size - 1)   pushIfMatch(i + 1);
    if (r > 0)          pushIfMatch(i - size);
    if (r < size - 1)   pushIfMatch(i + size);
  }

  function pushIfMatch(n){
    if (!visited[n] && pixels[n] === target){
      visited[n] = 1;
      stack.push(n);
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Tool / pointer handling
 * ------------------------------------------------------------------ */
function onPointerDown(e){
  if (!e.isPrimary) return;                 // ignore secondary pointers
  if (e.button !== undefined && e.button !== 0) return;   // left button / primary touch only
  const cell = eventToCell(e);
  if (!cell) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);   // keep receiving moves even outside

  if (currentTool === 'fill'){
    pushUndo();
    floodFill(cell.col, cell.row);
    render(); save();
    return;
  }

  if (currentTool === 'eyedropper'){
    pickColor(cell.col, cell.row);
    return;
  }

  // pencil / eraser → start a single undoable stroke
  drawing = true;
  pushUndo();
  const value = (currentTool === 'eraser') ? null : color;
  if (currentTool === 'pencil') addRecent(color);
  paintCell(cell.col, cell.row, value);
  lastCell = cell;
  render();
  renderRecents();
}

function onPointerMove(e){
  if (!drawing) return;
  const cell = eventToCell(e);
  if (!cell) return;
  const value = (currentTool === 'eraser') ? null : color;
  if (lastCell){
    paintLine(lastCell.col, lastCell.row, cell.col, cell.row, value);
  } else {
    paintCell(cell.col, cell.row, value);
  }
  lastCell = cell;
  render();
}

function onPointerUp(){
  if (!drawing) return;
  drawing = false;
  lastCell = null;
  save();
}

function pickColor(col, row){
  const c = pixels[row * size + col];
  if (c){
    color = c;
    syncColorUI();
    addRecent(c);
    renderRecents();
  }
  // convenience: switch back to the pencil after picking so you can keep drawing
  setTool('pencil');
}

/* ------------------------------------------------------------------ *
 *  Color handling
 * ------------------------------------------------------------------ */
function setColor(hex, record = true){
  color = hex;
  syncColorUI();
  if (record) addRecent(hex);
  renderRecents();
}

function syncColorUI(){
  colorInput.value = color;
  colorSwatch.style.background = color;
  colorHex.textContent = color.toUpperCase();
}

// Keep at most 8 recent colors, most-recent first, no duplicates.
function addRecent(hex){
  hex = (hex || '').toLowerCase();
  if (!hex) return;
  recents = recents.filter(c => c !== hex);
  recents.unshift(hex);
  if (recents.length > 8) recents.length = 8;
}

function renderPalette(){
  paletteEl.innerHTML = '';
  PALETTE.forEach(c => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    b.title = c.toUpperCase();
    b.dataset.color = c;
    b.addEventListener('click', () => setColor(c, true));
    paletteEl.appendChild(b);
  });
}

function renderRecents(){
  recentsEl.innerHTML = '';
  if (!recents.length){
    recentsEl.innerHTML = '<span class="muted small">No colors yet — start drawing!</span>';
    return;
  }
  recents.forEach(c => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    b.title = c.toUpperCase();
    b.dataset.color = c;
    b.addEventListener('click', () => setColor(c, true));
    recentsEl.appendChild(b);
  });
}

/* ------------------------------------------------------------------ *
 *  Tool selection (state machine)
 * ------------------------------------------------------------------ */
function setTool(tool){
  currentTool = tool;
  toolButtons.forEach(btn => {
    const active = btn.dataset.tool === tool;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
}

/* ------------------------------------------------------------------ *
 *  Undo / Redo
 *
 *  We snapshot the `pixels` array *before* each action and store it on the
 *  undo stack. A whole drag stroke calls pushUndo() exactly once (on the
 *  pointer-down), so it counts as a single step.
 * ------------------------------------------------------------------ */
function snapshot(){ return pixels.slice(); }

function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;                  // a new action invalidates the redo trail
  updateHistoryButtons();
}

function undo(){
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  pixels = undoStack.pop();
  render(); save(); updateHistoryButtons();
}

function redo(){
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  pixels = redoStack.pop();
  render(); save(); updateHistoryButtons();
}

function updateHistoryButtons(){
  undoBtn.disabled = undoStack.length === 0;
  redoBtn.disabled = redoStack.length === 0;
}

/* ------------------------------------------------------------------ *
 *  Clear / Change size
 * ------------------------------------------------------------------ */
function clearCanvas(){
  if (!confirm('Clear the whole canvas? (You can undo this.)')) return;
  pushUndo();
  pixels.fill(null);
  render(); save();
}

function changeSize(newSize){
  if (newSize === size) return;
  if (!confirm('Changing the canvas size will clear your drawing. Continue?')) return;
  size = newSize;
  pixels = new Array(size * size).fill(null);
  undoStack.length = 0;                  // old snapshots are the wrong shape
  redoStack.length = 0;
  sizeSelect.value = String(size);
  setupCanvas();
  render();
  updateHistoryButtons();
  save();
}

/* ------------------------------------------------------------------ *
 *  Export to PNG
 * ------------------------------------------------------------------ */
function downloadPNG(){
  const out = document.createElement('canvas');
  out.width  = size * EXPORT_SCALE;
  out.height = size * EXPORT_SCALE;
  const octx = out.getContext('2d');
  // Leave the background transparent; paint only the opaque cells.
  for (let r = 0; r < size; r++){
    for (let c = 0; c < size; c++){
      const col = pixels[r * size + c];
      if (col){
        octx.fillStyle = col;
        octx.fillRect(c * EXPORT_SCALE, r * EXPORT_SCALE, EXPORT_SCALE, EXPORT_SCALE);
      }
    }
  }
  const url = out.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pixel-art-' + size + 'x' + size + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ------------------------------------------------------------------ *
 *  Persistence (localStorage)
 * ------------------------------------------------------------------ */
function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      size, pixels, color, grid: gridOn, tool: currentTool, recents
    }));
  }catch(err){ /* storage full / unavailable — non-fatal */ }
}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !SIZES.includes(d.size)) return false;
    if (!Array.isArray(d.pixels) || d.pixels.length !== d.size * d.size) return false;

    size = d.size;
    pixels = d.pixels.map(v => (typeof v === 'string' ? v.toLowerCase() : null));
    if (typeof d.color === 'string' && /^#[0-9a-f]{6}$/i.test(d.color)) color = d.color.toLowerCase();
    if (typeof d.grid === 'boolean') gridOn = d.grid;
    if (TOOLS.includes(d.tool)) currentTool = d.tool;
    if (Array.isArray(d.recents)) recents = d.recents
      .filter(c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c))
      .map(c => c.toLowerCase()).slice(0, 8);
    return true;
  }catch(err){ return false; }
}

/* ------------------------------------------------------------------ *
 *  Event wiring
 * ------------------------------------------------------------------ */
function bindEvents(){
  // Pointer drawing (mouse / touch / pen).
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('lostpointercapture', () => { if (drawing) onPointerUp(); });

  // Prevent the context menu from interrupting a right-drag on the canvas.
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // Canvas options.
  sizeSelect.addEventListener('change', () => changeSize(parseInt(sizeSelect.value, 10)));
  gridToggle.addEventListener('change', () => { gridOn = gridToggle.checked; render(); save(); });

  // Tools.
  toolButtons.forEach(btn => btn.addEventListener('click', () => setTool(btn.dataset.tool)));

  // Color.
  colorInput.addEventListener('input', () => setColor(colorInput.value, true));

  // History / actions.
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);
  clearBtn.addEventListener('click', clearCanvas);
  downloadBtn.addEventListener('click', downloadPNG);

  // Keyboard shortcuts.
  window.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const k = (e.key || '').toLowerCase();

    // Undo / Redo
    if (mod && k === 'z' && e.shiftKey){ e.preventDefault(); redo(); return; }
    if (mod && k === 'z'){ e.preventDefault(); undo(); return; }
    if (mod && k === 'y'){ e.preventDefault(); redo(); return; }

    // Tool shortcuts (ignored while typing in a control).
    if (!mod && !e.altKey){
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      const map = { b:'pencil', e:'eraser', f:'fill', i:'eyedropper' };
      const t = map[k];
      if (t) setTool(t);
    }
  });

  // Re-render crisply if the display zoom / devicePixelRatio changes.
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { setupCanvas(); render(); }, 150);
  });
}

/* ------------------------------------------------------------------ *
 *  Boot
 * ------------------------------------------------------------------ */
function init(){
  load();                                        // restore saved drawing (may set size)
  sizeSelect.value = String(size);
  gridToggle.checked = gridOn;

  setupCanvas();
  renderPalette();
  renderRecents();
  setTool(currentTool);
  syncColorUI();
  render();
  updateHistoryButtons();
  bindEvents();
}

init();
</script>
